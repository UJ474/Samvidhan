services:
  - type: web
    name: samvidhan
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node apps/server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
